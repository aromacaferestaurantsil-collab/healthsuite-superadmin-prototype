name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create non-production Firebase config for compile/test
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "healthsuite-ci-placeholder",
              "storage_bucket": "healthsuite-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.healthsuite.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ci-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_FIREBASE_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: healthsuite-superadmin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
